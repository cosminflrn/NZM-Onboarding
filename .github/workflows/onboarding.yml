name: Onboarding
run-name: "${{ github.event_name != 'workflow_dispatch' && 'Regenerare după editare' || inputs.delete != '' && format('Ștergere {0} [{1}]', inputs.delete, inputs.rid) || format('Generare {0} [{1}]', inputs.url, inputs.rid) }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Link site (gol când doar ștergi clienți)
        required: false
      name:
        description: Nume brand (opțional)
        required: false
      discount:
        description: Cod discount (opțional)
        required: false
      sender_email:
        description: Email expeditor (opțional)
        required: false
      form_type:
        description: Formular (popup / embed)
        required: false
        default: popup
      site_type:
        description: Tip site (auto / ecommerce / non-ecommerce)
        required: false
        default: auto
      lang:
        description: Limba (auto / ro / en)
        required: false
        default: auto
      delete:
        description: Clienți de șters din istoric (slug1,slug2)
        required: false
      rid:
        description: ID cerere (pus de pagină)
        required: false
      bundle:
        description: Pagini preluate din browser (inbox/<id>.json, pus de pagină)
        required: false
      bundle_key:
        description: Cheie de unică folosință pentru pagina preluată (pusă de pagină, nu se afișează)
        required: false
      brandfetch:
        description: Rezultat Brandfetch NewsMAN (inbox/bf-<id>.json, pus de pagină)
        required: false
  push:
    branches: [main]
    paths:
      - "docs/clients/*/brand.json"
      - "templates/**"
      - "nzm/generate.py"
      - "nzm/emails.py"
      - "nzm/design.py"

permissions:
  contents: write

concurrency:
  group: onboarding
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalare
        run: |
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null 2>&1 || true
          pip install -r requirements.txt

      - name: Citire site și generare fișiere
        id: gen
        if: github.event_name == 'workflow_dispatch' && inputs.delete == ''
        # a site we cannot read is shown in the app, not as a failed run (so GitHub sends no failure e-mail)
        continue-on-error: true
        env:
          IN_URL: ${{ inputs.url }}
          IN_NAME: ${{ inputs.name }}
          IN_DISCOUNT: ${{ inputs.discount }}
          IN_SENDER: ${{ inputs.sender_email }}
          IN_FORM: ${{ inputs.form_type }}
          IN_SITE: ${{ inputs.site_type }}
          IN_LANG: ${{ inputs.lang }}
          IN_BUNDLE: ${{ inputs.bundle }}
          IN_BF: ${{ inputs.brandfetch }}
        run: |
          BF_ARGS=()
          if [[ "$IN_BF" =~ ^inbox/bf-[A-Za-z0-9_-]{4,64}\.json$ ]]; then
            # Brandfetch NewsMAN answers by webhook (Cloudflare saves it in inbox/): wait for it, up to 4 minutes
            for i in $(seq 1 48); do
              [ -f "$IN_BF" ] && break
              sleep 5; git pull -q --rebase origin main 2>/dev/null || true
            done
            if [ ! -f "$IN_BF" ]; then
              echo "::error title=Eroare generare::Brandfetch NewsMAN nu a trimis rezultatul în 4 minute. Încearcă din nou sau folosește sursa NewsMAN Onboarding."
              exit 1
            fi
            BF_ARGS=(--brandfetch "$IN_BF")
          fi
          python -m nzm scrape "$IN_URL" --name "$IN_NAME" --discount "$IN_DISCOUNT" \
            --sender-email "$IN_SENDER" --form-type "${IN_FORM:-popup}" --site-type "${IN_SITE:-auto}" --lang "${IN_LANG:-auto}" \
            --public-base "$PUBLIC_BASE" --github-output $(
              [[ "$IN_BUNDLE" =~ ^inbox/[a-z0-9]{4,12}\.json$ && -f "$IN_BUNDLE" ]] && echo --bundle "$IN_BUNDLE") "${BF_ARGS[@]}"

      - name: Ștergere din istoric
        if: github.event_name == 'workflow_dispatch' && inputs.delete != ''
        env:
          IN_DELETE: ${{ inputs.delete }}
        run: |
          [[ "$IN_DELETE" =~ ^[a-z0-9,-]+$ ]] || { echo "::error title=Eroare generare::listă invalidă"; exit 1; }
          python -m nzm delete "$IN_DELETE"
          echo "::notice title=deleted::$IN_DELETE"

      - name: Regenerare după editare
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)
          if echo "$changed" | grep -qE '^(templates/|nzm/(generate|emails|design)\.py)'; then
            python -m nzm regen-all
          else
            for f in $(echo "$changed" | grep -E '^docs/clients/[^/]+/brand.json$'); do
              [ -f "$f" ] && python -m nzm regen "$f"
            done
          fi

      - name: Salvare
        if: always()
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          IN_BUNDLE: ${{ inputs.bundle }}
          IN_BF: ${{ inputs.brandfetch }}
          GEN_OUTCOME: ${{ steps.gen.outcome }}
          IN_DELETE: ${{ inputs.delete }}
        run: |
          git config user.name "nzm-onboarding-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the captured page was only needed for this run
          if [[ "$IN_BUNDLE" =~ ^inbox/[a-z0-9]{4,12}\.json$ && -f "$IN_BUNDLE" ]]; then git rm -q "$IN_BUNDLE"; fi
          if [[ "$IN_BF" =~ ^inbox/bf-[A-Za-z0-9_-]{4,64}\.json$ && -f "$IN_BF" ]]; then git rm -q "$IN_BF"; fi
          # leftovers of runs GitHub cancelled before they started (it keeps only one waiting run): gone after 30 min
          now=$(date +%s)
          for f in inbox/*.json; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null); t=${t:-$now}
            if [ $((now - t)) -gt 1800 ]; then git rm -q "$f"; fi
          done
          if [ "$GEN_OUTCOME" != "failure" ]; then git add -A docs/clients; fi
          if git diff --cached --quiet; then echo "nimic de salvat"; exit 0; fi
          MSG="Onboarding: ${SLUG:-regenerare}"; [ -n "$IN_DELETE" ] && MSG="Ștergere din istoric: $IN_DELETE"
          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
