name: Onboarding

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      url:
        description: Link site
        required: true
      name:
        description: Nume brand (opțional)
        required: false
      discount:
        description: Cod discount (opțional)
        required: false
      sender_email:
        description: Email expeditor (opțional)
        required: false
  push:
    branches: [main]
    paths:
      - "docs/clients/*/brand.json"
      - "templates/**"
      - "nzm/generate.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: onboarding
  cancel-in-progress: false

jobs:
  generate:
    # issues: only those created from the form, by people with access to the repo
    if: >-
      github.event_name != 'issues' || (
        contains(github.event.issue.labels.*.name, 'onboarding') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null 2>&1 || true
          pip install -r requirements.txt

      - name: Read issue form
        id: form
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python -m nzm.issue

      - name: Scrape site and build templates
        id: gen
        if: github.event_name != 'push'
        env:
          IN_URL: ${{ steps.form.outputs.url || inputs.url }}
          IN_NAME: ${{ steps.form.outputs.name || inputs.name }}
          IN_DISCOUNT: ${{ steps.form.outputs.discount || inputs.discount }}
          IN_SENDER: ${{ steps.form.outputs.sender_email || inputs.sender_email }}
        run: |
          python -m nzm scrape "$IN_URL" --name "$IN_NAME" --discount "$IN_DISCOUNT" \
            --sender-email "$IN_SENDER" --public-base "$PUBLIC_BASE" --github-output 2>&1 | tee run.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Regenerate after edits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)
          if echo "$changed" | grep -qE '^(templates/|nzm/generate.py)'; then
            python -m nzm regen-all
          else
            for f in $(echo "$changed" | grep -E '^docs/clients/[^/]+/brand.json$'); do
              [ -f "$f" ] && python -m nzm regen "$f"
            done
          fi

      - name: Commit
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          git config user.name "nzm-onboarding-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/clients
          if git diff --cached --quiet; then echo "nimic de comis"; exit 0; fi
          git commit -m "Onboarding: ${SLUG:-regenerare}"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - name: Comment on issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.gen.outputs.slug }}
          NAME: ${{ steps.gen.outputs.name }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLUG" ] && [ -f "docs/clients/$SLUG/report.md" ]; then
            raw="https://github.com/$REPO/raw/main/docs/clients/$SLUG"
            {
              echo "✅ **Gata — $NAME**"
              echo
              echo "**[⬇ Descarcă toate fișierele (.zip)]($raw/${SLUG}__newsman-import.zip)** · [Previzualizare pe pagină]($PUBLIC_BASE/#c-$SLUG) · [Editează datele](https://github.com/$REPO/edit/main/docs/clients/$SLUG/brand.json)"
              echo
              for f in docs/clients/$SLUG/*__*.json; do echo "- [$(basename "$f")]($raw/$(basename "$f"))"; done
              echo
              echo "<details><summary>Raport</summary>"
              echo
              cat "docs/clients/$SLUG/report.md"
              echo
              echo "</details>"
            } > comment.md
            gh issue comment "$ISSUE" -R "$REPO" --body-file comment.md
            gh issue close "$ISSUE" -R "$REPO"
          else
            {
              echo "❌ Nu am reușit să generez fișierele. Detalii în [log]($RUN_URL)."
              echo
              echo '```'
              tail -n 15 run.log 2>/dev/null || true
              echo '```'
            } > comment.md
            gh issue comment "$ISSUE" -R "$REPO" --body-file comment.md
          fi
