name: Onboarding
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Generare {0} [{1}]', inputs.url, inputs.rid) || 'Regenerare după editare' }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Link site
        required: true
      name:
        description: Nume brand (opțional)
        required: false
      discount:
        description: Cod discount (opțional)
        required: false
      sender_email:
        description: Email expeditor (opțional)
        required: false
      form_type:
        description: Formular (popup / embed)
        required: false
        default: popup
      site_type:
        description: Tip site (auto / ecommerce / non-ecommerce)
        required: false
        default: auto
      rid:
        description: ID cerere (pus de pagină)
        required: false
  push:
    branches: [main]
    paths:
      - "docs/clients/*/brand.json"
      - "templates/**"
      - "nzm/generate.py"
      - "nzm/emails.py"
      - "nzm/design.py"

permissions:
  contents: write

concurrency:
  group: onboarding
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalare
        run: |
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null 2>&1 || true
          pip install -r requirements.txt

      - name: Citire site și generare fișiere
        id: gen
        if: github.event_name == 'workflow_dispatch'
        # a site we cannot read is shown in the app, not as a failed run (so GitHub sends no failure e-mail)
        continue-on-error: true
        env:
          IN_URL: ${{ inputs.url }}
          IN_NAME: ${{ inputs.name }}
          IN_DISCOUNT: ${{ inputs.discount }}
          IN_SENDER: ${{ inputs.sender_email }}
          IN_FORM: ${{ inputs.form_type }}
          IN_SITE: ${{ inputs.site_type }}
        run: |
          python -m nzm scrape "$IN_URL" --name "$IN_NAME" --discount "$IN_DISCOUNT" \
            --sender-email "$IN_SENDER" --form-type "${IN_FORM:-popup}" --site-type "${IN_SITE:-auto}" \
            --public-base "$PUBLIC_BASE" --github-output

      - name: Regenerare după editare
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)
          if echo "$changed" | grep -qE '^(templates/|nzm/(generate|emails|design)\.py)'; then
            python -m nzm regen-all
          else
            for f in $(echo "$changed" | grep -E '^docs/clients/[^/]+/brand.json$'); do
              [ -f "$f" ] && python -m nzm regen "$f"
            done
          fi

      - name: Salvare
        if: steps.gen.outcome != 'failure'
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          git config user.name "nzm-onboarding-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/clients
          if git diff --cached --quiet; then echo "nimic de salvat"; exit 0; fi
          git commit -m "Onboarding: ${SLUG:-regenerare}"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
