<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZM Onboarding</title>
<style>
  :root { --red:#c8102e; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e6ea; --bg:#f6f6f8; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
  header .wrap { display:flex; align-items:center; gap:12px; height:64px; }
  header b { font-size:18px; } header b span { color:var(--red); }
  header a { margin-left:auto; color:var(--muted); font-size:14px; }
  h2 { font-size:17px; margin:28px 0 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
  form.gen { display:grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap:10px; align-items:end; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button, .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font:inherit; font-size:14px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:600; }
  .hint { color:var(--muted); font-size:13px; margin-top:10px; }
  #status { margin-top:12px; font-size:14px; }
  .clients { display:grid; gap:14px; }
  .client { display:grid; grid-template-columns: 160px 1fr auto; gap:18px; align-items:center; }
  .client .logo { height:70px; display:flex; align-items:center; justify-content:center; background:#fafafa; border-radius:8px; padding:8px; }
  .client .logo img { max-height:54px; max-width:140px; }
  .client h3 { margin:0; font-size:16px; } .client .dom { color:var(--muted); font-size:13px; }
  .sw { display:inline-block; width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,.1); vertical-align:middle; margin-right:3px; }
  .warn { font-size:12px; color:#9a6700; margin-top:4px; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:360px; }
  .actions .btn { padding:7px 11px; font-size:13px; }
  dialog { width:min(1100px, 96vw); height:92vh; border:0; border-radius:12px; padding:0; }
  dialog .bar { display:flex; gap:6px; padding:10px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  dialog .bar .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  dialog .bar .close { margin-left:auto; }
  dialog .subj { padding:8px 16px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); }
  dialog .view { height:calc(92vh - 100px); overflow:auto; background:#eee; }
  .empty { color:var(--muted); }
  @media (max-width: 820px) { form.gen { grid-template-columns:1fr; } .client { grid-template-columns:1fr; } .actions { justify-content:flex-start; } }
</style>
</head>
<body>
<header><div class="wrap"><b>NZM <span>Onboarding</span></b><a id="repoLink" href="#">repo GitHub ↗</a></div></header>
<main class="wrap">
  <h2>Client nou</h2>
  <div class="card">
    <form class="gen" id="gen">
      <div><label>Link site *</label><input id="url" placeholder="https://magazin.ro" required></div>
      <div><label>Nume brand (opțional)</label><input id="name" placeholder="din site"></div>
      <div><label>Cod discount (opțional)</label><input id="discount" placeholder="ex. BINEAIVENIT10"></div>
      <div><label>Email expeditor (opțional)</label><input id="sender" placeholder="din site"></div>
      <button class="primary" type="submit">Generează →</button>
    </form>
    <div class="hint">Se deschide un issue pe GitHub deja completat — apasă <b>Create</b>. În 1–2 minute clientul apare mai jos (pagina se actualizează singură) și primești și comentariu cu fișierele în issue.</div>
    <div id="status"></div>
  </div>

  <h2>Clienți generați</h2>
  <div class="clients" id="clients"><div class="empty">Se încarcă…</div></div>
</main>

<dialog id="dlg">
  <div class="bar" id="tabs"></div>
  <div class="subj" id="subj"></div>
  <div class="view" id="view"></div>
</dialog>

<script src="bee-preview.js"></script>
<script>
  // ---- repo detection (owner.github.io/repo) with fallback
  const FALLBACK = { owner: "cosminflrn", repo: "NZM-Onboarding" };
  const host = location.hostname.endsWith("github.io") ? location.hostname.split(".")[0] : FALLBACK.owner;
  const repo = location.hostname.endsWith("github.io") ? (location.pathname.split("/")[1] || FALLBACK.repo) : FALLBACK.repo;
  const GH = `https://github.com/${host}/${repo}`;
  document.getElementById("repoLink").href = GH;

  const slugOf = (u) => {
    try { const h = new URL(/^https?:\/\//.test(u) ? u : "https://" + u).host.toLowerCase().replace(/^www\./, "");
      return h.replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); } catch { return null; }
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---- generate: open a prefilled issue (no token needed)
  document.getElementById("gen").addEventListener("submit", (e) => {
    e.preventDefault();
    const url = document.getElementById("url").value.trim();
    const slug = slugOf(url);
    if (!slug) return alert("Link invalid");
    const p = new URLSearchParams({
      template: "onboarding.yml", title: `Onboarding: ${slug}`, url,
      name: document.getElementById("name").value.trim(),
      discount: document.getElementById("discount").value.trim(),
      sender_email: document.getElementById("sender").value.trim(),
    });
    window.open(`${GH}/issues/new?${p}`, "_blank");
    watch(slug);
  });

  let known = {};
  function watch(slug) {
    const st = document.getElementById("status");
    const before = known[slug] || null;
    let tries = 0;
    st.textContent = `⏳ Aștept generarea pentru ${slug}…`;
    const t = setInterval(async () => {
      tries++;
      const list = await load();
      const c = list.find((x) => x.slug === slug);
      if (c && c.generated_at !== before) {
        clearInterval(t);
        st.innerHTML = `✅ Gata: <b>${esc(c.name)}</b> — vezi mai jos.`;
        document.getElementById("c-" + slug)?.scrollIntoView({ behavior: "smooth" });
      } else if (tries > 60) {
        clearInterval(t);
        st.innerHTML = `Încă nu apare. Verifică <a href="${GH}/actions" target="_blank">Actions</a> sau issue-ul.`;
      }
    }, 10000);
  }

  // ---- list
  async function load() {
    let list = [];
    try { list = await (await fetch(`clients/index.json?t=${Date.now()}`, { cache: "no-store" })).json(); } catch {}
    render(list);
    return list;
  }

  function render(list) {
    const box = document.getElementById("clients");
    known = Object.fromEntries(list.map((c) => [c.slug, c.generated_at]));
    if (!list.length) { box.innerHTML = `<div class="empty">Niciun client încă.</div>`; return; }
    box.innerHTML = list.map((c) => {
      const dir = `clients/${c.slug}/`;
      const files = c.files.filter((f) => f.endsWith(".json")).map((f) =>
        `<a class="btn" href="${dir}${f}" download>${esc(f.split("__")[1].replace(".json", "").replace(/^\d-/, ""))}</a>`).join("");
      const zip = c.files.find((f) => f.endsWith(".zip"));
      const w = c.warnings.length ? `<div class="warn">⚠ ${c.warnings.length} de verificat: ${esc(c.warnings[0])}${c.warnings.length > 1 ? " …" : ""}</div>` : "";
      return `<div class="card client" id="c-${c.slug}">
        <div class="logo">${c.logo ? `<img src="${esc(c.logo)}" alt="">` : "<span class=empty>fără logo</span>"}</div>
        <div><h3>${esc(c.name)}</h3><div class="dom"><a href="${esc(c.url)}" target="_blank">${esc(c.domain)}</a> · ${esc(c.generated_at || "")}</div>
          <div style="margin-top:6px">${["accent", "dark", "light"].map((k) => `<span class="sw" title="${k} ${c.colors[k]}" style="background:${c.colors[k]}"></span>`).join("")}
          <span class="dom">${c.products} produse reale</span></div>${w}</div>
        <div class="actions">
          ${zip ? `<a class="btn" href="${dir}${zip}" download><b>⬇ Toate (.zip)</b></a>` : ""}${files}
          <button onclick="preview('${c.slug}')">👁 Previzualizare</button>
          <a class="btn" href="${dir}report.md" target="_blank">Raport</a>
          <a class="btn" href="${GH}/edit/main/docs/clients/${c.slug}/brand.json" target="_blank" title="Modifici datele, salvezi, iar fișierele se regenerează automat">✏ Editează date</a>
        </div></div>`;
    }).join("");
  }

  // ---- preview
  async function preview(slug) {
    const list = await (await fetch(`clients/index.json?t=${Date.now()}`)).json();
    const c = list.find((x) => x.slug === slug);
    const dir = `clients/${slug}/`;
    const get = async (part) => (await fetch(dir + c.files.find((f) => f.includes(part)) + `?t=${Date.now()}`)).json();
    const [form, welcome, auto] = await Promise.all([get("Pop-up"), get("Welcome"), get("cos-abandonat")]);
    const views = [];
    const f = form.data.form;
    views.push({ name: "Pop-up", subj: f.form_name, bee: JSON.parse(f.pages.form.form_json) });
    views.push({ name: "Mulțumire", subj: "după abonare", bee: JSON.parse(f.pages.responder.responder_json) });
    views.push({ name: "Email confirmare", subj: f.template.subject, bee: JSON.parse(f.template.confirm_email_json) });
    views.push({ name: "Welcome", subj: "template newsletter", bee: welcome.data });
    const meta = auto.data.draft_meta.meta;
    Object.values(meta).sort((a, b) => a.trigger_id - b.trigger_id).forEach((d, i) =>
      views.push({ name: `Coș email ${i + 1}`, subj: d.automation_subject, bee: JSON.parse(d.params.json) }));
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = views.map((v, i) => `<button class="tab" data-i="${i}">${esc(v.name)}</button>`).join("") +
      `<button class="close" onclick="document.getElementById('dlg').close()">✕</button>`;
    const show = (i) => {
      tabs.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
      document.getElementById("subj").textContent = "Subiect / nume: " + (views[i].subj || "");
      document.getElementById("view").innerHTML = BeePreview.render(views[i].bee);
    };
    tabs.querySelectorAll(".tab").forEach((b) => b.onclick = () => show(+b.dataset.i));
    show(3);
    document.getElementById("dlg").showModal();
  }

  load();
</script>
</body>
</html>
